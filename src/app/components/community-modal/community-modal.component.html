<ion-header>
  <ion-toolbar class="modal-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()" fill="clear" class="circle-btn glass" aria-label="Cerrar">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <span class="title">{{ community?.name }}</span>
    <ion-buttons slot="end">
      <span class="period-badge">{{ period?.label }}</span>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-content">
  <div class="body">
    <div class="hero-container" *ngIf="data?.images?.length">
      <ion-spinner
        *ngIf="imageLoading()"
        name="crescent"
        class="image-spinner"
        color="primary">
      </ion-spinner>

      <img
        *ngIf="!imageLoading() && !imageError()"
        [src]="data?.images[0]"
        [alt]="community?.name"
        class="hero-img"
        (load)="onImageLoad()"
        (error)="onImageError()"
        #imgRef
        (load)="checkImageLoaded($event.target)" />

      <div *ngIf="imageError()" class="image-error">
        <ion-icon name="image-off"></ion-icon>
        <span>No se pudo cargar la imagen</span>
      </div>

      <p class="photo-credit" *ngIf="data?.photoCredit && !imageLoading()">{{ data?.photoCredit }}</p>
    </div>

    <p class="lineage" *ngIf="community?.lineage">
      <ion-icon name="people"></ion-icon>
      {{ community?.lineage }}
    </p>

    <div class="info-card">
      <div class="info-row" *ngIf="data?.timeRange">
        <span class="info-icon indigo">
          <ion-icon name="time"></ion-icon>
        </span>
        <div class="info-text">
          <p class="info-label">Tiempo de hábitat</p>
          <p class="info-value">{{ data?.timeRange }}</p>
        </div>
      </div>
      <div class="info-row" *ngIf="data?.modeOfLife">
        <span class="info-icon violet">
          <ion-icon name="people"></ion-icon>
        </span>
        <div class="info-text">
          <p class="info-label">Modo de vida</p>
          <p class="info-value">{{ data?.modeOfLife }}</p>
        </div>
      </div>
    </div>

    <p class="summary" *ngIf="data?.summary">{{ data?.summary }}</p>

    <div class="sources" *ngIf="data?.sources?.length">
      <p class="sources-title">
        <ion-icon name="document-text"></ion-icon>
        Fuentes
      </p>
      <ul>
        <li *ngFor="let s of data?.sources">{{ s }}</li>
      </ul>
    </div>
  </div>
</ion-content>
