<div class="welcome">
  <div class="card">
    <span class="brand-badge">
      <ion-icon name="earth"></ion-icon>
    </span>
    <h1>Huellas <strong>Originarias</strong></h1>
    <p class="tagline">
      Recorré los territorios de los pueblos originarios de Argentina
      a través del tiempo.
    </p>
    <p class="hint">
      Avanzá por momentos históricos, tocá las manchas del mapa y
      conocé quiénes habitaron cada lugar.
    </p>
    <button type="button" class="btn-primary" (click)="start()">
      Comenzar
      <ion-icon name="chevron-forward"></ion-icon>
    </button>
  </div>
</div>
